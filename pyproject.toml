[project]
name = "fithara"
version = "0.1.0"
description = "License drafting assistant service"
readme = "README.md"
authors = [
    { name = "Kasir Barati", email = "kasir.barati@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-ai>=1.0.5",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pydantic-evals>=1.0.5",
    "ruff>=0.8",
    "pyright>=1.1.389",
    "pre-commit>=4.0",
    "flake8-aaa>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "TID",      # flake8-tidy-imports — enforces the barrel-import convention below
]
ignore = [
    "E501",     # line-length handled by formatter
]

# ruff's B008 (no function calls in argument defaults) special-cases `Depends(...)` for FastAPI
# route handlers, but only when the parameter's type annotation is unsubscripted or `tuple[X, ...]`
# — a subscripted annotation like `list[int]` or `Agent[None, Out]` isn't recognized and gets
# flagged as a false positive. `Depends` is always safe as a default (that's the whole point of
# FastAPI's dependency injection), so exempt it outright rather than annotate around the quirk.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

# Packages with a barrel `__init__.py` (src/utils, src/registry, src/modules/licenses, ...)
# must be imported as `from src.utils import X`, never by reaching into the submodule that
# actually defines X. Add a "<package>.<submodule>" entry here whenever a new barrel package
# is introduced. Per-file-ignores below list the deliberate exceptions: the barrel file itself
# (which has to import from its own submodules) and unit tests exercising a symbol that is
# intentionally private (not re-exported).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.utils.config".msg = "Import from the src.utils barrel instead: `from src.utils import ...`."
"src.utils.errors".msg = "Import from the src.utils barrel instead: `from src.utils import ...`."
"src.utils.api_model".msg = "Import from the src.utils barrel instead: `from src.utils import ...`."
"src.utils.rate_limit".msg = "Import from the src.utils barrel instead: `from src.utils import ...`."
"src.utils.observability".msg = "Import from the src.utils barrel instead: `from src.utils import ...`."
"src.registry.loader".msg = "Import from the src.registry barrel instead: `from src.registry import ...`."
"src.registry.models".msg = "Import from the src.registry barrel instead: `from src.registry import ...`."
"src.modules.licenses.routes".msg = "Import from the src.modules.licenses barrel instead: `from src.modules.licenses import ...`."
"src.modules.draft.types".msg = "Import from the src.modules.draft barrel instead: `from src.modules.draft import ...`."
"src.modules.draft.rules".msg = "Import from the src.modules.draft barrel instead: `from src.modules.draft import ...`."
"src.modules.draft.agent".msg = "Import from the src.modules.draft barrel instead: `from src.modules.draft import ...`."
"src.modules.draft.routes".msg = "Import from the src.modules.draft barrel instead: `from src.modules.draft import ...`."

[tool.ruff.lint.per-file-ignores]
"**/*__test.py" = ["S101"]
"tests/**/*.py" = ["S101"]
"src/utils/__init__.py" = ["TID251"]
"src/utils/errors.py" = ["TID251"]  # sibling import of its own package's api_model.py
"src/utils/rate_limit.py" = ["TID251"]  # sibling import of its own package's config.py/errors.py
"src/utils/observability.py" = ["TID251"]  # sibling import of its own package's config.py
"src/registry/__init__.py" = ["TID251"]
"src/registry/loader.py" = ["TID251"]  # sibling import of its own package's models.py
"src/modules/licenses/__init__.py" = ["TID251"]
"src/modules/draft/__init__.py" = ["TID251"]
"src/modules/draft/rules.py" = ["TID251"]  # sibling import of its own package's types.py
"src/modules/draft/agent.py" = ["TID251"]  # sibling import of its own package's types.py
"src/modules/draft/routes.py" = ["TID251"]  # sibling import of its own package's types.py/agent.py
# Exercises active_licenses_by_order/find_license_or_error, which are intentionally
# not re-exported from the barrel — they're module-internal, not part of the public API.
"src/modules/licenses/routes__test.py" = ["TID251"]
# Exercises enforce_conversation_limits, intentionally not re-exported from the barrel.
"src/modules/draft/routes__test.py" = ["TID251"]
# Exercises _safe_error_fields, intentionally private (not re-exported from the barrel).
"src/modules/draft/agent__test.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "dist", "build"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
