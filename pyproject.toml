[project]
name = "fithara"
version = "0.1.0"
description = "License drafting assistant service"
readme = "README.md"
authors = [
    { name = "Kasir Barati", email = "kasir.barati@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-ai>=1.0.5",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pydantic-evals>=1.0.5",
    "ruff>=0.8",
    "pyright>=1.1.389",
    "pre-commit>=4.0",
    "flake8-aaa>=0.17.2",
    "import-linter>=2.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line-length handled by formatter
]

# ruff's B008 (no function calls in argument defaults) special-cases `Depends(...)` for FastAPI
# route handlers, but only when the parameter's type annotation is unsubscripted or `tuple[X, ...]`
# — a subscripted annotation like `list[int]` or `Agent[None, Out]` isn't recognized and gets
# flagged as a false positive. `Depends` is always safe as a default (that's the whole point of
# FastAPI's dependency injection), so exempt it outright rather than annotate around the quirk.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"**/*__test.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "dist", "build"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

# Every package with a barrel `__init__.py` (src/utils, src/registry, src/modules/licenses,
# src/modules/draft, ...) is "protected": nothing outside it may import a submodule directly
# (`from src.utils.config import Settings`), only via the barrel (`from src.utils import Settings`).
# `**` matches at any depth, so a new file added to an existing package needs no config change
# here at all — only a brand new barrel package needs its own contract. Run via `make lint_check`
# (`lint-imports`).
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "src.utils internals are private"
type = "protected"
protected_modules = ["src.utils.**"]
allowed_importers = ["src.utils", "src.utils.**"]

[[tool.importlinter.contracts]]
name = "src.registry internals are private"
type = "protected"
protected_modules = ["src.registry.**"]
allowed_importers = ["src.registry", "src.registry.**"]

[[tool.importlinter.contracts]]
name = "src.modules.licenses internals are private"
type = "protected"
protected_modules = ["src.modules.licenses.**"]
allowed_importers = ["src.modules.licenses", "src.modules.licenses.**"]

[[tool.importlinter.contracts]]
name = "src.modules.draft internals are private"
type = "protected"
protected_modules = ["src.modules.draft.**"]
allowed_importers = ["src.modules.draft", "src.modules.draft.**"]
