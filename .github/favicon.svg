        fill="url(#purple)" stroke="#1b1e3c" stroke-width="16" stroke-linejoin="round" paint-order="stroke"/>

  <!-- Page: top-right corner stretched up along the purple's curve -->
  <path d="M196 348 C196 318 210 320 242 320 L300 320 C322 320 339.5 313 352.5 299.5 C340 318 320 325 320 345 L320 422 Q320 442 300 442 L196 442 Z"
